<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Madrid, 26 jours</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout : appli plein écran façon vignette de la série — compteur JOUR X/26 en haut, scène dessinée, fil de messages, titre + sous-titre en bas */
:root{
  --bg:#0d0f14; --bg-2:#161a23; --line:#262c3a; --text:#f1f2f5; --muted:#8f97ab;
  --red:#e8263a; --blue:#2f6bff; --ball:#ff8a1f; --gold:#f5c542;
  --f-display:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --f-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.45;overflow:hidden;-webkit-user-select:none;user-select:none;
  background-image:radial-gradient(ellipse at 50% 0%,rgba(47,107,255,.18),transparent 55%),radial-gradient(ellipse at 50% 100%,rgba(232,38,58,.14),transparent 50%)}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;touch-action:manipulation;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 12px}

/* En-tête */
.top{display:grid;gap:8px;padding-top:4px}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.day{font-family:var(--f-display);font-size:22px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.day b{color:var(--red);font-weight:400}
.snd{font-family:var(--f-label);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;background:var(--bg-2);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.snd[aria-pressed="true"]{color:var(--text);border-color:var(--blue)}
.bar{height:6px;background:var(--bg-2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--red));transition:width .8s cubic-bezier(.3,1,.4,1)}
.dots{display:flex;gap:5px}
.dots span{flex:1;height:3px;border-radius:3px;background:var(--line);transition:background .4s}
.dots span.on{background:var(--muted)}.dots span.cur{background:var(--text)}

/* Scène */
.scene{position:relative;margin-top:12px;border-radius:18px;background:var(--bg-2);border:1px solid var(--line);overflow:hidden;flex:none;aspect-ratio:36/22;max-height:34vh;width:100%;max-width:100%;align-self:center}
.scene svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene .enter{animation:sceneIn .7s cubic-bezier(.3,1.3,.5,1)}
@keyframes sceneIn{from{opacity:0;transform:scale(1.08)}}
.polaroid{position:absolute;right:10px;bottom:10px;width:30%;background:#fff;padding:5px 5px 14px;transform:rotate(5deg);box-shadow:0 8px 20px rgba(0,0,0,.5);animation:polaroid .8s cubic-bezier(.3,1.5,.5,1) .4s both}
.polaroid img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
@keyframes polaroid{from{transform:rotate(-20deg) translateY(40px);opacity:0}}

/* Fil de messages */
.feed{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:14px 2px 8px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%;animation:msgIn .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes msgIn{from{opacity:0;transform:translateY(14px) scale(.9)}}
.msg .av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:14px;color:#fff}
.msg .bub{background:var(--bg-2);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 12px;min-width:0;overflow-wrap:anywhere}
.msg .who{display:block;font-family:var(--f-label);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:1px}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bub{background:var(--blue);border-color:var(--blue);border-radius:16px 16px 4px 16px}
.msg.me .who{color:#cfe0ff}
.msg.narr{align-self:center;max-width:100%}
.msg.narr .bub{background:none;border:0;text-align:center;color:var(--muted);font-style:italic;padding:2px 8px}
.typing .bub{display:flex;gap:4px;padding:12px 14px}
.typing .bub i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dot 1s infinite}
.typing .bub i:nth-child(2){animation-delay:.15s}.typing .bub i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-4px);opacity:1}}

/* Titre façon vignette */
.caption{display:grid;gap:2px;padding-top:6px;border-top:1px solid var(--line)}
.place{font-family:var(--f-label);font-weight:700;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--red);display:flex;align-items:center;gap:6px}
.place::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);animation:ping 1.6s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(232,38,58,.7)}100%{box-shadow:0 0 0 10px rgba(232,38,58,0)}}
.ttl{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,10vw,48px);line-height:1;letter-spacing:.01em;text-transform:uppercase;margin:0;text-wrap:balance}
.ttl.anim{animation:ttlIn .6s cubic-bezier(.3,1.4,.5,1)}
@keyframes ttlIn{from{opacity:0;transform:translateY(16px);letter-spacing:.2em}}
.sub{font-family:var(--f-label);font-weight:500;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.controls{display:flex;gap:10px;align-items:center;padding-top:10px;padding-bottom:env(safe-area-inset-bottom,0px)}
.btn{font-family:var(--f-label);font-weight:700;font-size:18px;letter-spacing:.08em;text-transform:uppercase;border:0;border-radius:14px;padding:14px 18px;cursor:pointer;min-height:52px;
  background:var(--red);color:#fff;box-shadow:0 4px 0 #8f1222;transition:transform .1s,box-shadow .1s;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8f1222}
.btn.ghost{background:var(--bg-2);color:var(--muted);box-shadow:0 4px 0 #07080b;border:1px solid var(--line)}
.btn.next{flex:1}
.btn.next.ready{animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateX(5px)}}
.btn:focus-visible,.snd:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

/* Animations des scènes */
.dash{stroke-dasharray:6 7;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 2.4s ease-out .3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:popIn .5s cubic-bezier(.3,1.8,.5,1) both}
@keyframes popIn{from{transform:scale(0);opacity:0}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.descend{animation:descend 2.6s cubic-bezier(.3,.7,.4,1) both}
@keyframes descend{from{transform:translate(-160px,-90px) rotate(-12deg)}to{transform:none}}
.ball{animation:rally 1.3s ease-in-out infinite alternate}
@keyframes rally{0%{transform:translate(0,0)}25%{transform:translate(55px,-28px)}50%{transform:translate(112px,4px)}75%{transform:translate(165px,-22px)}100%{transform:translate(220px,0)}}
.padL{transform-box:fill-box;transform-origin:center;animation:padL 1.3s ease-in-out infinite alternate}
.padR{transform-box:fill-box;transform-origin:center;animation:padR 1.3s ease-in-out infinite alternate}
@keyframes padL{0%{transform:rotate(-25deg) translateY(-6px)}100%{transform:rotate(10deg) translateY(10px)}}
@keyframes padR{0%{transform:rotate(-10deg) translateY(10px)}100%{transform:rotate(25deg) translateY(-6px)}}
.zzz{animation:zzz 3s ease-in infinite;opacity:0}
@keyframes zzz{0%{transform:translate(0,0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translate(30px,-60px) scale(1.3);opacity:0}}
.ring{transform-box:fill-box;transform-origin:50% 100%;animation:ring 3s ease-in-out infinite}
@keyframes ring{0%,70%,100%{transform:none}74%,82%,90%{transform:rotate(-14deg)}78%,86%,94%{transform:rotate(14deg)}}
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.06)}}
.drive{animation:drive 1.7s cubic-bezier(.4,.1,.6,1) both}
@keyframes drive{from{transform:translateX(-260px)}to{transform:none}}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .4s linear 4}
.peck{transform-box:fill-box;transform-origin:50% 100%;animation:peck .5s ease-in-out infinite alternate}
@keyframes peck{to{transform:rotate(14deg)}}
.gone{animation:gone .1s linear 1.45s forwards}
@keyframes gone{to{opacity:0}}
.pouf{transform-box:fill-box;transform-origin:center;animation:pouf .7s cubic-bezier(.3,1.8,.5,1) 1.45s both}
@keyframes pouf{0%{transform:scale(0);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
.feather{opacity:0;animation:feather 2.2s ease-out calc(1.45s + var(--d)) forwards}
@keyframes feather{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.halo{opacity:0;animation:halo 1.6s ease-out 2s forwards}
@keyframes halo{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:1;transform:translateY(-36px)}}
.score{opacity:0;animation:popIn2 .6s cubic-bezier(.3,1.8,.5,1) 2.6s forwards;transform-box:fill-box;transform-origin:center}
@keyframes popIn2{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.shake{animation:shake .4s 1.45s}
@keyframes shake{25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,1px)}}
.swing{transform-box:fill-box;transform-origin:50% 0;animation:swing 2.4s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.shine{animation:shine 2.4s ease-in-out infinite}
@keyframes shine{50%{opacity:.25}}
.wave{transform-box:fill-box;transform-origin:center;animation:wave 2s ease-out infinite;opacity:0}
@keyframes wave{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.rain{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.rain i{position:absolute;top:-30px;left:var(--l);width:var(--s);height:var(--s);border-radius:50%;background:var(--c);box-shadow:inset -3px -3px 0 rgba(0,0,0,.15);animation:fall var(--t) cubic-bezier(.4,.1,.7,1) var(--dl) forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}
  .rain{display:none}
}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <div class="top-row">
      <div class="day" id="day" aria-live="polite">JOUR <b>1</b>/26</div>
      <div style="display:flex;gap:8px"><button class="snd" id="lang" type="button" aria-label="Changer de langue / Cambiar idioma">ES</button><button class="snd" id="snd" type="button" aria-pressed="false">Son off</button></div>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </header>
  <div class="scene" id="scene" aria-hidden="true"></div>
  <div class="feed" id="feed" aria-live="polite"></div>
  <div class="caption">
    <div class="place" id="place"></div>
    <h1 class="ttl" id="ttl"></h1>
    <div class="sub" id="sub"></div>
  </div>
  <div class="controls">
    <button class="btn ghost" id="prev" type="button" aria-label="Chapitre précédent">◀</button>
    <button class="btn next" id="next" type="button">Suivant</button>
  </div>
</div>

<script>
/* =====================================================================
   CONFIGURATION — tous les textes sont ici, modifie-les librement.
   who : "moi", "chris", "nelson", "leo" ou "narr" (narration).
   photo : chemin optionnel (ex. "photos/chapitre1.jpg") ; si l'image
   n'existe pas, elle est simplement ignorée.
   ===================================================================== */
const CONFIG = {
  ME: "Elian",
  PEOPLE: {
    moi:    { name: "Moi",    color: "#2f6bff" },
    chris:  { name: "Chris",  color: "#e8263a" },
    nelson: { name: "Nelson", color: "#f08a24" },
    leo:    { name: "Léo",    color: "#1fa67a" }
  },
  CHAPTERS: [
    { day: 1, place: "Luxembourg", title: "Le départ", sub: "Valise, raquette, décollage", scene: "plane", photo: "photos/chapitre1.jpg",
      lines: [
        { who: "narr", t: "Luxembourg, très tôt le matin." },
        { who: "moi", t: "Raquette ok. Revêtements ok. Chaussures ok. Moral : au max." },
        { who: "moi", t: "Direction Madrid. 26 jours de ping. On y va." }
      ] },
    { day: 1, place: "Madrid", title: "Atterrissage", sub: "Soleil, chaleur, ping", scene: "land", photo: "photos/chapitre2.jpg",
      lines: [
        { who: "narr", t: "Madrid. Il fait déjà chaud, et ce n'est que le premier jour." },
        { who: "moi", t: "Je suis posé ! Le soleil tape fort ici." },
        { who: "chris", t: "Bienvenue en Espagne frérot. Prépare-toi, tu vas en baver." }
      ] },
    { day: 2, place: "Madrid", title: "Avec Chris", sub: "Refaire le monde", scene: "chat", photo: "photos/chapitre3.jpg",
      lines: [
        { who: "chris", t: "Alors, le niveau ici, ça te fait peur ?" },
        { who: "moi", t: "Peur non. Mais j'ai compris que mon revers allait souffrir." },
        { who: "chris", t: "Ton revers souffre depuis 2019, c'est pas nouveau." },
        { who: "moi", t: "Merci pour le soutien, vraiment." },
        { who: "narr", t: "Des discussions comme ça, il y en a eu tous les soirs." }
      ] },
    { day: 5, place: "Salle d'entraînement", title: "Tous les jours", sub: "Cinq heures par jour", scene: "table", photo: "photos/chapitre4.jpg",
      lines: [
        { who: "nelson", t: "On recommence. Plus bas sur les jambes. Encore." },
        { who: "leo", t: "Allez, une dernière série et on mange." },
        { who: "nelson", t: "Il a dit ça il y a quarante minutes." },
        { who: "moi", t: "Mes jambes ne m'appartiennent plus." },
        { who: "narr", t: "Entraînement tous les jours. Environ cinq heures. Sans exception." }
      ] },
    { day: 9, place: "Le salon", title: "Mon QG", sub: "Canapé, couverture, réveil", scene: "sofa", photo: "photos/chapitre5.jpg",
      lines: [
        { who: "narr", t: "Ma chambre pendant le stage : le salon." },
        { who: "moi", t: "Honnêtement, ce canapé, c'est le meilleur hôtel d'Espagne." },
        { who: "leo", t: "Debout ! On part dans dix minutes." },
        { who: "moi", t: "Cinq minutes encore… zzz" }
      ] },
    { day: 14, place: "En voiture", title: "La Clio rouge", sub: "Deux pigeons, zéro survivant", scene: "clio", photo: "photos/chapitre6.jpg",
      lines: [
        { who: "narr", t: "Ce jour-là, Nelson prend le volant de la Clio rouge." },
        { who: "nelson", t: "Tranquille, je connais la route." },
        { who: "narr", t: "Deux pigeons traversent. Ils n'auraient pas dû." },
        { who: "moi", t: "NELSON ?!" },
        { who: "nelson", t: "Ils étaient prévenus." },
        { who: "narr", t: "Score final : Pigeons 0, Clio 2. On en rit encore." }

    { day: 20, place: "Barcelone → Perpignan", title: "La route du tournoi", sub: "Dernier sprint, compétition", scene: "road", photo: "photos/chapitre7.jpg",
      lines: [
        { who: "narr", t: "Après Madrid, cap sur Barcelone, puis le tournoi de Perpignan." },
        { who: "nelson", t: "Tu as bossé. Maintenant tu joues libéré." },
        { who: "moi", t: "Je mène, j'accélère." }
      ] },
    { day: 26, place: "Fin du stage", title: "Merci les gars", sub: "Chris, Nelson, Léo", scene: "end", photo: "photos/chapitre8.jpg",
      lines: [
        { who: "narr", t: "26 jours. Des heures de ping, des fous rires, un canapé et deux pigeons." },
        { who: "moi", t: "Chris, merci pour l'accueil, les discussions et les vannes. Tu as rendu ce mois inoubliable." },
        { who: "moi", t: "Nelson, merci pour le coaching, la patience et la conduite… mémorable." },
        { who: "moi", t: "Et Léo, merci d'avoir souffert avec moi à chaque séance." },

  ],
  CHAPTERS_ES: [
    { day: 1, place: "Luxemburgo", title: "La salida", sub: "Maleta, pala, despegue", scene: "plane", photo: "photos/chapitre1.jpg",

        { who: "nelson", t: "Tranquilos, me sé el camino." },
        { who: "narr", t: "Dos palomas cruzan. No deberían haberlo hecho." },
        { who: "moi", t: "¡¿NELSON?!" },

        { who: "narr", t: "26 días. Horas de ping, risas sin parar, un sofá y dos palomas." },

        { who: "moi", t: "Nelson, gracias por el coaching, la paciencia y la conducción… memorable." },

(() => {

    if(li < CH[ci].lines.length){ nextLine(); return; }
    if(ci < CH.length-1){ tone(330,.12,"triangle",660); render(ci+1); }
    else { tone(330,.12,"triangle",660); render(0); }
  }
  nextBtn.addEventListener("click", e=>{ e.stopPropagation(); advance(); });
  $("#prev").addEventListener("click", e=>{ e.stopPropagation(); if(ci > 0) render(ci-1); });
  $("#app").addEventListener("click", e=>{ if(e.target.closest("button")) return; advance(); });
  window.addEventListener("keydown", e=>{ if(e.key==="ArrowRight"||e.key===" "){ e.preventDefault(); advance(); } if(e.key==="ArrowLeft" && ci>0) render(ci-1); });

  function countUp(){
    document.querySelectorAll("[data-count]").forEach(el=>{
      const target = Number(el.dataset.count), t0 = performance.now(), dur = reduce ? 1 : 2200;
      (function f(now){ const p = Math.min(1,(now-t0)/dur); el.textContent = Math.round(target*(1-Math.pow(1-p,3))); if(p<1 && document.contains(el)) requestAnimationFrame(f); })(t0);
    });
  }
  function sceneSfx(s){
    if(s==="plane"){ later(()=>tone(180,1.6,"sawtooth",420,.05),200); }
    if(s==="land"){ later(()=>tone(400,1.2,"sawtooth",160,.04),300); later(()=>noise(.3),2500); }
    if(s==="table"){ for(let k=0;k<6;k++) later(()=>tone(1400,.03,"square",0,.05),k*650+300); }
    if(s==="clio"){ later(()=>tone(90,1.4,"sawtooth",160,.06),0); later(()=>noise(.35),1450); later(()=>tone(520,.1,"square",260),2600); }
    if(s==="end"){ [523,659,784,1047].forEach((f,k)=>later(()=>tone(f,.18,"triangle",0,.08),300+k*140)); }
  }
  function rain(){
    if(reduce) return;
    const box = document.createElement("div"); box.className = "rain"; document.body.appendChild(box);
    let h = ""; for(let i=0;i<60;i++) h += `<i style="--l:${Math.random()*100}%;--s:${10+Math.random()*12}px;--t:${2.4+Math.random()*2.4}s;--dl:${Math.random()*1.8}s;--dx:${(Math.random()-.5)*120}px;--c:${Math.random()<.6?"#ff8a1f":"#f1f2f5"}"></i>`;
    box.innerHTML = h; setTimeout(()=>box.remove(), 7000);
  }

  function applyLang(){
    document.documentElement.lang = lang;
    $("#lang").textContent = L().other;
    $("#prev").setAttribute("aria-label", L().prev);
    $("#snd").textContent = soundOn ? L().sOn : L().sOff;
    CH = lang === "es" ? CONFIG.CHAPTERS_ES : CONFIG.CHAPTERS;
  }
  $("#lang").addEventListener("click", e=>{
    e.stopPropagation(); lang = lang === "fr" ? "es" : "fr";
    try{ localStorage.setItem("m26_lang", lang); }catch(err){}
    applyLang(); tone(660,.08); render(ci);
  });
  applyLang();
  render(ci);
})();
</script>
</body>
</html>
